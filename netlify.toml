# ------------------------------------------------------------------
# En-têtes de cache (équivalent du bloc mod_expires du .htaccess)
# ------------------------------------------------------------------
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
