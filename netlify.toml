[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ------------------------------------------------------------------
# Redirections 301 — portées depuis public/.htaccess (Apache O2Switch).
# Netlify ne supporte pas les regex : les motifs datés WordPress utilisent
# des placeholders (:y/:m/:d) ou l'énumération des années (2018-2026).
# Premier match gagnant : règles spécifiques AVANT les génériques.
# HTTPS et www→apex sont gérés par Netlify (domaine primaire = patrimed.fr).
# Non porté (introuvable sans regex, retombe en 404 ou /patriactu) :
#   - /elementor-<n>       (reliquats de thème, sans valeur SEO)
#   - l'article « livret A » à slug tronqué (capté par /:année/* → /patriactu)
# ------------------------------------------------------------------

# --- Anciens articles WordPress, forme datée /AAAA/MM/JJ/slug ---
[[redirects]]
  from = "/:y/:m/:d/la-diversification-de-linvestissement-pour-minimiser-les-risques"
  to = "/patriactu/diversification"
  status = 301

[[redirects]]
  from = "/:y/:m/:d/la-loi-girardin-solution-de-defiscalisation-en-outre-mer"
  to = "/patriactu/loi-girardin"
  status = 301

[[redirects]]
  from = "/:y/:m/:d/pourquoi-faire-appel-a-patrimed"
  to = "/patriactu/pourquoi-patrimed"
  status = 301

[[redirects]]
  from = "/:y/:m/:d/pourquoi-faire-appel-patrimed"
  to = "/patriactu/pourquoi-patrimed"
  status = 301

[[redirects]]
  from = "/:y/:m/:d/scpi"
  to = "/patriactu/scpi"
  status = 301

[[redirects]]
  from = "/:y/:m/:d/taux-dusure-hausse-des-taux"
  to = "/patriactu/taux-usure"
  status = 301

[[redirects]]
  from = "/:y/:m/:d/second-articlestaux-usure-hausse-taux"
  to = "/patriactu/taux-usure"
  status = 301

